name: Build & Release APK

# Builds three release APKs (same layout split as upstream Streamflix Reborn):
#   BetterStreamflix.apk            — universal (mobile + TV)
#   BetterStreamflix-only-Mobile.apk
#   BetterStreamflix-only-TV.apk
#
# Trigger: push tag v*              → GitHub Release with all three assets
#          push to main             → upload all three as artifacts (no release)
#          workflow_dispatch        → upload all three as artifacts (no release)
#
# Signing requires Actions secrets SIGNING_KEYSTORE_BASE64, SIGNING_KEY_ALIAS,
# SIGNING_STORE_PASSWORD, SIGNING_KEY_PASSWORD (legacy KEYSTORE also accepted).
# Tags fail without them; main / manual runs upload unsigned APKs instead.
#
# Feature branches (dskja/**) intentionally do NOT run this workflow.
# Use "Build APKs" (debug, ~5–10 min) for day-to-day testing, or dispatch
# this workflow manually when you need signed release APKs.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main

concurrency:
  group: apk-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Release APK (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: universal
            app_layout: ""
            apk_name: BetterStreamflix.apk
          - name: mobile
            app_layout: "mobile"
            apk_name: BetterStreamflix-only-Mobile.apk
          - name: tv
            app_layout: "tv"
            apk_name: BetterStreamflix-only-TV.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK environment
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

      - name: Access Secrets
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          RABBITSTREAM_SOURCE_API: ${{ secrets.RABBITSTREAM_SOURCE_API }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
        run: |
          touch local.properties
          if [ -n "$TMDB_API_KEY" ]; then
            echo "TMDB_API_KEY=$TMDB_API_KEY" >> local.properties
          fi
          if [ -n "$RABBITSTREAM_SOURCE_API" ]; then
            echo "RABBITSTREAM_SOURCE_API=$RABBITSTREAM_SOURCE_API" >> local.properties
          fi
          if [ -n "$TRAKT_CLIENT_ID" ]; then
            echo "TRAKT_CLIENT_ID=$TRAKT_CLIENT_ID" >> local.properties
          fi
          if [ -n "$TRAKT_CLIENT_SECRET" ]; then
            echo "TRAKT_CLIENT_SECRET=$TRAKT_CLIENT_SECRET" >> local.properties
          fi
          if [ -n "$SIMKL_CLIENT_ID" ]; then
            echo "SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID" >> local.properties
          fi

      - name: Generate native-lib.cpp from template
        env:
          UPROT_API_BASE: ${{ secrets.UPROT_API_BASE }}
          UPROT_SIGN_KEY: ${{ secrets.UPROT_SIGN_KEY }}
          UPROT_DIRECT_API_BASE: ${{ secrets.UPROT_DIRECT_API_BASE }}
          UPROT_DIRECT_KEY: ${{ secrets.UPROT_DIRECT_KEY }}
        run: |
          if [ -n "$UPROT_DIRECT_KEY" ] || [ -n "$UPROT_API_BASE" ]; then
            sed -e "s|{{UPROT_API_BASE}}|$UPROT_API_BASE|g" \
                -e "s|{{UPROT_SIGN_KEY}}|$UPROT_SIGN_KEY|g" \
                -e "s|{{UPROT_DIRECT_API_BASE}}|$UPROT_DIRECT_API_BASE|g" \
                -e "s|{{UPROT_DIRECT_KEY}}|$UPROT_DIRECT_KEY|g" \
                app/src/main/cpp/native-lib.cpp.template > app/src/main/cpp/native-lib.cpp
          fi

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Set APP_LAYOUT
        run: |
          if [ -n "${{ matrix.app_layout }}" ]; then
            echo "APP_LAYOUT=${{ matrix.app_layout }}" >> local.properties
          else
            sed -i '/^APP_LAYOUT=/d' local.properties || true
          fi

      - name: Build release APK
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: ./gradlew :app:assembleRelease --stacktrace

      # Signing secrets (repo Settings → Secrets and variables → Actions):
      #   SIGNING_KEYSTORE_BASE64  — base64 of the .jks/.keystore file
      #   SIGNING_KEY_ALIAS
      #   SIGNING_STORE_PASSWORD
      #   SIGNING_KEY_PASSWORD
      # Legacy alias still accepted: KEYSTORE (same value as SIGNING_KEYSTORE_BASE64).
      - name: Check signing secrets
        id: signing_secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE: ${{ secrets.KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          KEYSTORE_B64="${SIGNING_KEYSTORE_BASE64:-$KEYSTORE}"
          missing=()
          [ -z "$KEYSTORE_B64" ] && missing+=("SIGNING_KEYSTORE_BASE64 (or legacy KEYSTORE)")
          [ -z "$SIGNING_KEY_ALIAS" ] && missing+=("SIGNING_KEY_ALIAS")
          [ -z "$SIGNING_STORE_PASSWORD" ] && missing+=("SIGNING_STORE_PASSWORD")
          [ -z "$SIGNING_KEY_PASSWORD" ] && missing+=("SIGNING_KEY_PASSWORD")

          if [ ${#missing[@]} -eq 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets present."
            exit 0
          fi

          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Missing signing secrets: ${missing[*]}"
          cat <<'EOF'
          Required GitHub Actions secrets for signed release APKs:
            SIGNING_KEYSTORE_BASE64  — base64-encoded .jks/.keystore
            SIGNING_KEY_ALIAS
            SIGNING_STORE_PASSWORD
            SIGNING_KEY_PASSWORD
          Optional legacy fallback for the keystore blob: KEYSTORE
          Encode with: base64 -w0 your-release.jks > keystore.b64
          EOF

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "::error::Cannot publish a tagged release without signing secrets."
            exit 1
          fi

          echo "Non-tag run: will upload unsigned release APK artifacts."

      - name: Sign APK
        id: sign_apk
        if: steps.signing_secrets.outputs.available == 'true'
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEYSTORE_BASE64 || secrets.KEYSTORE }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Rename APK
        run: |
          if [ "${{ steps.signing_secrets.outputs.available }}" = "true" ]; then
            src="${{ steps.sign_apk.outputs.signedReleaseFile }}"
          else
            src=$(ls app/build/outputs/apk/release/*-unsigned.apk | head -n 1)
            echo "::warning::Uploading unsigned release APK (signing secrets not configured)."
          fi
          test -n "$src" && test -f "$src"
          cp "$src" "${{ matrix.apk_name }}"
          ls -lh "${{ matrix.apk_name }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}-${{ github.sha }}
          path: ${{ matrix.apk_name }}
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: build-and-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all release APKs
        uses: actions/download-artifact@v4
        with:
          pattern: release-*-${{ github.sha }}
          merge-multiple: true
          path: dist

      - name: Verify APKs
        run: |
          ls -lh dist/
          test -f dist/BetterStreamflix.apk
          test -f dist/BetterStreamflix-only-Mobile.apk
          test -f dist/BetterStreamflix-only-TV.apk

      - name: Extract changelog for this version
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { p=1; print; next }
            p && /^## \[/ { exit }
            p { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q . release-notes.md; then
            echo "No CHANGELOG section found for $VERSION" >&2
            exit 1
          fi
          echo "Extracted release notes for $VERSION:"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BetterStreamflix ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/BetterStreamflix.apk
            dist/BetterStreamflix-only-Mobile.apk
            dist/BetterStreamflix-only-TV.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Bundle the three APKs into one downloadable artifact for main / manual runs.
  upload-bundle:
    name: Bundle release artifacts
    needs: build-and-release
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all release APKs
        uses: actions/download-artifact@v4
        with:
          pattern: release-*-${{ github.sha }}
          merge-multiple: true
          path: dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BetterStreamflix-apks-${{ github.sha }}
          path: |
            dist/BetterStreamflix.apk
            dist/BetterStreamflix-only-Mobile.apk
            dist/BetterStreamflix-only-TV.apk
          if-no-files-found: error
          retention-days: 14
